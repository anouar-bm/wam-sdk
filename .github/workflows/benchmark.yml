name: Benchmark

# Not run on every push: a full comparison takes several minutes and most
# changes don't touch performance (see bench/README.md, "Where it runs").
#   - pull request: add the label `run-benchmark` to compare base and head
#   - release: compare with the previous release tag, attach the report
on:
  pull_request:
    types: [labeled]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pull-request:
    name: Benchmark PR against its base
    if: ${{ github.event_name == 'pull_request' && github.event.label.name == 'run-benchmark' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Each side is built with its own lockfile, so dependency changes are measured too.
      - run: npm ci && npm run build
        working-directory: base
      - run: npm ci && npm run build
        working-directory: candidate
      - run: npx playwright install --with-deps chromium firefox
        working-directory: candidate
      - name: Run benchmark (base and head interleaved in one job)
        working-directory: candidate
        run: node bench/run.mjs --base ../base --rounds 10 --out bench-results.json | tee bench-report.md
      - name: Write job summary
        if: ${{ !cancelled() }}
        working-directory: candidate
        run: cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: benchmark
          path: |
            candidate/bench-results.json
            candidate/bench-report.md
          retention-days: 30

  release:
    name: Benchmark release against previous release
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the report to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          fetch-depth: 0
      - name: Find previous release tag
        id: previous
        working-directory: candidate
        run: echo "tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.previous.outputs.tag != '' }}
        with:
          ref: ${{ steps.previous.outputs.tag }}
          path: base
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: ${{ steps.previous.outputs.tag != '' }}
        run: npm ci && npm run build
        working-directory: base
      - run: npm ci && npm run build
        working-directory: candidate
      - run: npx playwright install --with-deps chromium firefox
        working-directory: candidate
      - name: Run benchmark
        working-directory: candidate
        run: |
          base_args=()
          if [ -n "${{ steps.previous.outputs.tag }}" ]; then base_args=(--base ../base); fi
          node bench/run.mjs "${base_args[@]}" --rounds 20 --out bench-results.json | tee bench-report.md
          cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Attach report to the release
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" bench-report.md bench-results.json --clobber
