<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="modes" content="plain isolated">
	<title>automation-timing</title>
	<script type="module">
		import { createGainWam, messageBarrier } from '../fixtures/gain-wam.js';
		import { expectSamples, runPageTest } from '../lib/audit.js';

		// wam-automation events must change the gain at their exact sample,
		// including events inside a later quantum and on a quantum boundary.
		// Model: WPT audioworkletglobalscope-timing-info (quantum boundaries).
		const sampleRate = 48000;
		const length = 1536;
		// [sample, gain]; scheduled out of order to check the queue sorts them.
		const changes = [[300, 1], [100, 0.25], [1024, 0], [256, 0.75]];

		runPageTest(async () => {
			const context = new OfflineAudioContext({ numberOfChannels: 1, length, sampleRate });
			const wam = await createGainWam(context);
			const source = new ConstantSourceNode(context, { offset: 1 });
			source.connect(wam.audioNode).connect(context.destination);
			source.start(0);

			wam.audioNode.scheduleEvents(...changes.map(([sample, value]) => ({
				type: 'wam-automation',
				time: sample / sampleRate,
				data: { id: 'gain', value, normalized: false },
			})));
			await messageBarrier(wam.audioNode);

			const rendered = await context.startRendering();
			const expected = new Float32Array(length).fill(0.5);
			for (const [sample, value] of [...changes].sort((a, b) => a[0] - b[0])) expected.fill(value, sample);
			return expectSamples(rendered.getChannelData(0), expected, 0);
		});
	</script>
</head>
<body></body>
</html>
