<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="modes" content="plain isolated">
	<title>midi-timing</title>
	<script type="module">
		import { createGainWam, messageBarrier } from '../fixtures/gain-wam.js';
		import { expectSamples, runPageTest } from '../lib/audit.js';

		// Each MIDI note-on adds note/128 to the output at its sample (silent
		// input), so the rendered audio shows where every event landed.
		// Two notes share sample 500 to check simultaneous events both apply.
		// The main thread must also see the events dispatched in time order.
		const sampleRate = 48000;
		const length = 1024;
		const notes = [[700, 64], [3, 32], [500, 16], [127, 96], [128, 8], [500, 4]];

		runPageTest(async () => {
			const context = new OfflineAudioContext({ numberOfChannels: 1, length, sampleRate });
			const wam = await createGainWam(context);
			wam.audioNode.connect(context.destination);

			const dispatched = [];
			wam.audioNode.addEventListener('wam-midi', (e) => dispatched.push(e.detail.data.bytes[1]));
			wam.audioNode.scheduleEvents(...notes.map(([sample, note]) => ({
				type: 'wam-midi',
				time: sample / sampleRate,
				data: { bytes: [0x90, note, 100] },
			})));
			await messageBarrier(wam.audioNode);

			const rendered = await context.startRendering();
			const expected = new Float32Array(length);
			for (const [sample, note] of notes) expected[sample] += note / 128;
			const audio = expectSamples(rendered.getChannelData(0), expected, 0);
			if (!audio.pass) return audio;

			// Main-thread notifications are asynchronous; wait for all of them.
			const deadline = performance.now() + 2000;
			while (dispatched.length < notes.length && performance.now() < deadline) {
				await new Promise((resolve) => setTimeout(resolve, 10));
			}
			const expectedOrder = [...notes].sort((a, b) => a[0] - b[0]).map(([, note]) => note);
			const sameSet = [...dispatched].sort().join() === [...expectedOrder].sort().join();
			if (!sameSet) return { pass: false, message: `dispatched notes [${dispatched}], expected [${expectedOrder}]` };
			// Notes 16 and 4 share a sample, so either order between them is valid.
			const timeOrdered = dispatched.join() === expectedOrder.join()
				|| dispatched.join() === expectedOrder.join().replace('16,4', '4,16');
			return timeOrdered
				? { pass: true, message: `${notes.length} notes at exact samples, dispatched in time order` }
				: { pass: false, message: `dispatch order [${dispatched}], expected time order [${expectedOrder}]` };
		});
	</script>
</head>
<body></body>
</html>
